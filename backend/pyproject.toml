[project]
name = "analytica-workbench-backend"
version = "0.3.0"
description = "Serverless analytical backend for Analytica Workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "duckdb==1.5.5",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "statsmodels==0.14.6",
    "pyarrow==25.0.1",
    "openpyxl>=3.1.5,<4.0",
    "vercel>=0.5.0,<1.0",
]

[tool.uv]
package = false

[[tool.vercel.subscribers]]
entrypoint = "tasks"
