name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed local runtime/generated state
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files             'backend/.analytica/**'             'backend/analytica.db*'             'backend/package-lock.json'             'package-lock.json'             '*.tsbuildinfo')"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden generated/runtime files are tracked:"
            echo "$forbidden"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Python backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app.py analytica_api tests
      - run: python -m compileall -q app.py analytica_api
      - run: python -m pytest -q
